<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Les Cendres de Valgris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ash:#0b0907;--soot:#1c1713;--bone:#e2d6c0;--dim:#a39680;--gold:#c9a45c;--blood:#b3261e;--mana:#3557c8;--ember:#e06a2b;--panel:rgba(20,15,11,.95);--line:#4f402d;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ash:#0b0907;--soot:#1c1713;--bone:#e2d6c0}}
:root[data-theme="dark"]{--ash:#0b0907}
html,body{height:100%;margin:0;background:var(--ash);color:var(--bone);overflow:hidden;font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;touch-action:none;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
/* v6.48 : X des fiches de talent et d’objet ; fenêtre « Au sol » */
.selbox .selx{float:right;width:40px;height:40px;margin:-4px -8px 4px 10px;padding:0;border-radius:50%;font-size:18px;line-height:38px;background:rgba(34,25,15,.97);color:var(--bone);border:1px solid #6b5535;cursor:pointer;font-family:inherit}
#ground{position:absolute;right:12px;bottom:120px;max-width:56vw;pointer-events:auto;font-size:14px;display:flex;flex-direction:column-reverse;align-items:flex-end}
#ground .gchip{background:rgba(20,15,10,.86);border:1px solid #6b5535;color:var(--bone);border-radius:18px;padding:7px 12px;min-height:36px;font-family:inherit;font-size:14px;cursor:pointer}
#ground .glist{margin:0 0 4px;min-width:180px;background:rgba(20,15,10,.92);border:1px solid #4a3c28;border-radius:6px;max-height:38vh;overflow:auto;padding:4px}
#ground .glist button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #2e251a;padding:8px 6px;min-height:36px;font-family:inherit;font-size:14px;cursor:pointer}
#tl{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:58vw}
#zname{font-family:"Grenze Gotisch",Georgia,serif;font-size:22px;color:var(--gold);text-shadow:0 2px 6px #000}
#track{font-size:14px;line-height:1.35;color:var(--bone);text-shadow:0 1px 3px #000;margin-top:2px}
#track b{color:var(--gold);font-weight:700}
#mini{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:150px;height:96px;border:1px solid var(--line);background:rgba(0,0,0,.45);border-radius:3px}
/* v6.09 : effets de la zone écrits en petit sous la mini-carte ; un toucher montre le détail */
#zmods{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 110px);max-width:150px;text-align:right;font-size:11px;line-height:1.3;color:#c8b8a0;text-shadow:0 1px 2px #000;pointer-events:auto;cursor:pointer}
#zmods .d{display:none;color:#a39680;font-size:11px}#zmods.open .d{display:block}#zmods.open{background:rgba(10,7,5,.6);padding:4px 6px;border-radius:3px;max-width:min(220px,60vw)}
@media (max-width:520px){#zmods{top:calc(env(safe-area-inset-top,0px) + 86px);max-width:112px}}
#tbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);text-align:center;display:none;min-width:200px}
#tname{font-size:15px;font-weight:700;text-shadow:0 1px 3px #000}
.tb{height:7px;background:#2a0f0c;border:1px solid #000;margin-top:3px}
.tb i{display:block;height:100%;background:var(--blood);width:100%}
/* v6.08 : barre du bas centrée, les deux bulles toujours entières (bords arrondis et encoches : zones sûres) */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(max(env(safe-area-inset-bottom,0px),4px) + 10px) max(12px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:8px;box-sizing:border-box}
.orb{width:74px;height:74px;border-radius:50%;border:2px solid #5d4a30;background:#120c08;position:relative;overflow:hidden;box-shadow:0 0 0 3px #1d150e,0 4px 12px #000;flex:none}
.orb i{position:absolute;left:0;right:0;bottom:0;height:100%}
.orb.hp i{background:radial-gradient(circle at 40% 30%,#e4544a,#7d0f0b 70%)}
.orb.mp i{background:radial-gradient(circle at 40% 30%,#6e8cff,#152a86 70%)}
.orb::after{content:"";position:absolute;left:18%;top:10%;width:40%;height:28%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);pointer-events:none}
.orb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-shadow:0 1px 2px #000}
#mid{flex:1 1 auto;min-width:0;max-width:520px;display:flex;flex-direction:column;gap:6px;align-items:center}
#xpb{width:100%;height:5px;background:#1b1610;border:1px solid #3a2f20}
#xpb i{display:block;height:100%;width:0;background:var(--gold)}
#btns{display:flex;gap:6px;pointer-events:auto;justify-content:center;flex-wrap:wrap}
#btns button{width:54px;height:52px;border:1px solid #5d4a30;background:linear-gradient(#2a2119,#17110c);color:var(--bone);border-radius:4px;font:inherit;font-size:11px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
#btns button .g{font-size:19px}
#btns button.dim{opacity:.55}
.panel.wide{width:min(460px,96vw);padding:14px 12px 12px}
.doll{position:relative;margin:4px auto 8px;background:radial-gradient(ellipse at 50% 45%,#2e2318,#0e0a07 75%);border:1px solid var(--line);border-radius:3px}
.slot{position:absolute;border:1px solid #4a3c28;background:rgba(0,0,0,.4);border-radius:2px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.slot.ok{border-color:#7fd07f;background:rgba(80,160,80,.12)}.slot.hl{border-color:#7fd07f;box-shadow:0 0 0 2px #7fd07f inset}.slot.bad{border-color:#d07060}
.slot .lbl{font-size:9px;color:#6b5c44;text-align:center;line-height:1.1;padding:2px}
.heroPrev{position:absolute;pointer-events:none}
.dstat{position:absolute;font-size:11px;color:var(--dim);line-height:1.35;display:flex;flex-direction:column}.dstat b{color:var(--bone);font-size:12px}
.gridc{position:relative;margin:0 auto;background-color:#0d0906;background-image:linear-gradient(to right,#2a2016 1px,transparent 1px),linear-gradient(to bottom,#2a2016 1px,transparent 1px);border:1px solid var(--line);box-sizing:content-box}
.gridc.hl{box-shadow:0 0 0 2px #7fd07f}.gridc.bad{box-shadow:0 0 0 2px #d07060}
.itm{position:absolute;box-sizing:border-box;border:1px solid;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;border-radius:2px}
.itm img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.itm .ph{font-weight:700;color:var(--bone)}
.itm.r0{background:rgba(110,100,80,.22);border-color:#5e5444}.itm.r1{background:rgba(60,80,210,.28);border-color:#5a6cff}
.itm.set{background:rgba(70,180,90,.24)!important;border-color:#5fd06a!important}
.itm.r2{background:rgba(210,180,40,.24);border-color:#d8b030}.itm.r3{background:rgba(255,130,30,.3);border-color:#ff9a3a;box-shadow:0 0 6px rgba(255,140,40,.6) inset}
.itm.sel{outline:2px solid #fff;outline-offset:-1px;z-index:2}
.upb{position:absolute;top:0;right:1px;font-size:9px;color:#7fd07f;text-shadow:0 0 2px #000}
.lockb{position:absolute;bottom:0;left:1px;font-size:9px;line-height:1;filter:drop-shadow(0 0 1px #000)}
.ghost{position:fixed;pointer-events:none;z-index:60;opacity:.9}
.invbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:6px 0}.invbar .st{margin-right:auto}
.stabs{display:flex;gap:4px;margin:0 0 6px}.stabs button{margin:0}
.selbox{border-top:1px solid #2e251a;margin-top:6px;padding-top:8px}
.orbrow{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:2px}.orbrow .min{margin:2px 3px 2px 0}
.panel .xclose,.fiche .xclose{position:sticky;top:-10px;float:right;z-index:6;width:40px;height:40px;margin:-10px -8px 4px 8px;padding:0;font-size:20px;line-height:38px;border-radius:50%;background:rgba(34,25,15,.97);box-shadow:0 2px 8px #000}
.laplist{display:flex;flex-direction:column;gap:4px}.panel .lapit{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:8px;text-align:left;margin:0;padding:4px 8px;font-weight:400;font-size:14px}.lapit img{grid-row:1/3;width:34px;height:34px;object-fit:contain;border:1px solid #5e5444;border-radius:3px}.lapit img.r1{border-color:#5a6cff}.lapit img.r2{border-color:#d8b030}.lapit img.r3{border-color:#ff9a3a}.lapit .st{font-size:11px}
.regl{display:flex;flex-direction:column;align-items:flex-start}
.panel .tabs{gap:3px;margin:-2px 44px 8px 0}.panel .tabs button{margin:0;padding:4px 8px;font-size:12.5px;font-weight:700;line-height:1.2}
.matbox{border:1px solid #4f402d;background:rgba(0,0,0,.28);border-radius:3px;padding:7px 9px;margin:6px 0 8px;font-size:13px;line-height:1.45}.matbox>b{color:#e8c46a;font-size:14px}.matbox .st b{color:#d6c9b0;font-weight:700}
.selhead{display:flex;gap:10px;align-items:center}.selhead img{width:44px;height:44px;object-fit:contain;border:1px solid #5e5444;border-radius:3px;flex:none}
.selhead img.r1{border-color:#5a6cff;background:rgba(60,80,210,.28)}.selhead img.r2{border-color:#d8b030;background:rgba(210,180,40,.24)}.selhead img.r3{border-color:#ff9a3a;background:rgba(255,130,30,.3)}
.lines{margin:6px 0 4px;font-size:13.5px;line-height:1.45}
.tree.b4 .tal{width:36px;height:36px;font-size:17px}.tree.b4 .tier{gap:2px}.tree.b5 .tal{width:31px;height:31px;font-size:15px}.tree.b5 .brh{font-size:11px}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:6px 0}
.brn{border:1px solid #2e251a;border-radius:3px;background:rgba(0,0,0,.25);padding:3px 2px}
.brh{text-align:center;font-weight:700;font-size:13px;display:flex;flex-direction:column;line-height:1.1;margin-bottom:2px}.brh .st{font-size:10px;font-weight:400}
.tier{display:flex;justify-content:center;gap:4px;min-height:50px;align-items:center;border-top:1px dashed #2a2118;position:relative}
.tier.lockt .tal{opacity:.3;filter:grayscale(1)}.tier .req{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:8.5px;color:#7a6a50;pointer-events:none;z-index:1}
.panel .tal{position:relative;width:44px;height:44px;margin:0;padding:0;border-radius:6px;font-size:21px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#2a2119,#130e0a);border:1px solid #4a3c28}
.tal.has{border-color:#c9a45c}.tal.can{box-shadow:0 0 0 1px #7fd07f}.tal.ult{border-radius:50%;border-color:#ff9a3a}.tal.inf{border-style:double;border-width:3px}
.tal.on{outline:2px solid #fff}.tal i{position:absolute;bottom:-2px;right:-2px;font-style:normal;font-size:10px;background:#000;color:var(--gold);border-radius:6px;padding:0 3px;line-height:14px}
.badge{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ember);color:#fff;font-style:normal;font-weight:700;font-size:13px;line-height:18px;text-align:center}
.tabs{display:flex;gap:4px;margin:-4px 0 10px;flex-wrap:wrap}.tabs button{margin:0;padding:6px 10px;font-size:13px}.tabs button.on,.panel button.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:14px}.grid span{color:var(--dim)}
.up{color:#7fd07f;font-weight:700}.dn{color:#d07060}.bt{display:flex;flex-direction:column;align-items:flex-end}
.riftsel{display:flex;align-items:center;gap:6px;margin:8px 0}.riftsel b{font-size:18px;min-width:100px;text-align:center;color:#d8a8ff}.riftsel button{margin:0}
#btns button:focus-visible,.panel button:focus-visible,.ov button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#btns button kbd{display:none;font:inherit;color:var(--dim);font-size:10px}
@media (hover:hover) and (pointer:fine){#btns button kbd{display:block}}
@media (max-width:520px){#btns{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;width:100%}#btns button{flex:0 0 calc((100% - 16px) / 5);max-width:46px;width:auto;min-width:0;height:44px;font-size:10px;letter-spacing:-.2px;overflow:hidden;white-space:nowrap}.orb{width:clamp(52px,15vw,62px);height:clamp(52px,15vw,62px);flex:none}#bottom{gap:6px}#mini{width:112px;height:72px}#zname{font-size:19px}#track{font-size:13px}}
/* v6.08 : nom de la compétence touchée, écrit en transparence au-dessus du bouton ; au toucher long, coût, recharge et effet. Ne bloque aucun toucher. */
#sktip{position:fixed;z-index:5;pointer-events:none;opacity:0;transition:opacity .35s;text-align:center;color:rgba(242,230,204,.82);text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8);font-size:14px;line-height:1.3;max-width:min(300px,86vw);transform:translateX(-50%)}
#sktip b{font-family:"Grenze Gotisch",Georgia,serif;font-size:19px;color:rgba(232,196,106,.9);font-weight:700}
#sktip.long{font-size:13px;background:rgba(10,7,5,.35);padding:6px 9px;border-radius:4px}
#cinetxt{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:min(88vw,560px);z-index:50;pointer-events:none;opacity:0;text-align:center;font-family:"Grenze Gotisch",Georgia,serif;font-weight:700;font-size:clamp(22px,6.4vw,34px);line-height:1.25;color:#fff4dc;text-shadow:0 0 18px #ffb060,0 2px 4px #000,0 0 3px #000}
body.cine #hud{opacity:0;transition:opacity .6s}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:"Grenze Gotisch",Georgia,serif;font-size:26px;color:var(--gold);text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .4s;text-align:center;width:90vw}
#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);font-size:15px;color:var(--bone);text-shadow:0 1px 3px #000;pointer-events:none;text-align:center;width:90vw}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);max-height:78vh;overflow:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 0 0 4px #120d09,0 20px 50px #000;padding:18px 18px 14px;border-radius:3px}
.panel h2{font-family:"Grenze Gotisch",Georgia,serif;font-weight:700;font-size:28px;margin:0 0 8px;color:var(--gold);line-height:1.1}
.panel h3{font-size:15px;margin:14px 0 6px;color:var(--dim);font-weight:700}
.panel p{margin:0 0 10px;line-height:1.45;font-size:16px}
.panel .say{font-style:italic;color:#d6c9b0}
.panel button,.ov button{font:inherit;font-size:15px;font-weight:700;background:linear-gradient(#3a2c1d,#22190f);color:var(--bone);border:1px solid #6b5535;padding:9px 14px;border-radius:3px;cursor:pointer;margin:4px 6px 4px 0}
.panel button.min{font-size:13px;padding:5px 9px;font-weight:400}
.panel .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #2e251a}
.panel .row:first-of-type{border-top:0}
.it{font-weight:700}.r0{color:#e2d6c0}.r1{color:#8796ff}.r2{color:#f0d050}
.st{font-size:13px;color:var(--dim);line-height:1.35}
.hidden{display:none!important}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse at 50% 60%,rgba(80,30,10,.35),rgba(0,0,0,.92) 70%);padding:20px}
.ov h1{font-family:"Grenze Gotisch",Georgia,serif;font-weight:700;font-size:clamp(44px,11vw,92px);line-height:.95;margin:0;color:#d9b468;text-shadow:0 0 30px rgba(224,106,43,.45),0 4px 0 #2a1408}
.ov .sub{font-size:18px;color:var(--dim);margin:10px 0 26px}
.fiche{position:fixed;z-index:40;font-family:inherit;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);max-height:82vh;overflow:auto;background:linear-gradient(#211910,#140f09);border:1px solid #8a6a3a;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.8);padding:14px 16px 16px;color:var(--bone);font-size:15px}
.fiche h2{margin:0 30px 4px 0;font-size:21px}.fiche .lines{line-height:1.45;margin:8px 0}.fgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0;font-size:14px}.fgrid span{color:var(--dim)}
.fiche .xclose{color:var(--bone);border:1px solid #6b5535;cursor:pointer;font-family:inherit}
button.fst{background:none;border:none;padding:0;margin:0;color:var(--dim);font:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted}
.newconf{max-width:380px;margin-top:14px;padding:12px 14px;background:rgba(20,14,8,.92);border:1px solid #6b5535;border-radius:4px;color:var(--bone);font-size:15px;line-height:1.45}.newconf p{margin:0 0 10px}
.ov .help{max-width:420px;font-size:14px;color:var(--dim);line-height:1.5;margin-top:22px}

/* v6.37 : lisibilité au téléphone. Plus de texte sous 10 px, petits boutons d’au moins 36 px de haut. */
.slot .lbl{font-size:10.5px}
.upb,.lockb{font-size:11px}
.brh .st{font-size:11.5px}
.tier{min-height:56px;flex-wrap:wrap}
.tier .req{font-size:10px}
.tal i{font-size:11.5px;line-height:15px}
.lapit .st{font-size:12px}
.panel button.min{padding:8px 11px;min-height:36px}
.panel .tabs button{padding:8px 10px;min-height:36px}
.tabs button{min-height:36px}

/* v6.44 : la description de l’objet ou du talent touché reste collée en bas du panneau, sans faire défiler */
.panel .selbox{position:sticky;bottom:-14px;z-index:4;background:var(--panel);margin:6px -18px -14px;padding:8px 18px 12px;max-height:42vh;overflow:auto;box-shadow:0 -8px 12px rgba(0,0,0,.45);border-top:1px solid #4a3c28}
/* v6.52 : rangée « Barre » en haut de la fiche du talent et dans la fiche complète, toujours visible ; fiche collée opaque */
.panel .selbox{background:#140f0b}
.barrow{clear:both;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:6px 0 4px;font-size:14px;color:var(--dim)}
.barrow>span{margin-right:2px}
.barrow button,.panel .barrow button{min-width:42px;min-height:42px;margin:0;padding:4px 6px;font:inherit;font-size:15px;font-weight:700;line-height:1.1;background:linear-gradient(#3a2c1d,#22190f);color:var(--bone);border:1px solid #6b5535;border-radius:4px;cursor:pointer}
.barrow button.on,.panel .barrow button.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.barrow button small{font-size:12px;font-weight:400;opacity:.85;margin-left:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="tl"><div id="zname"></div><div id="track"></div></div>
  <canvas id="mini" width="300" height="192"></canvas>
  <div id="ground" class="hidden"></div>
  <div id="zmods" class="hidden" role="button" aria-label="Effets de la zone"></div>
  <div id="tbar"><div id="tname"></div><div class="tb"><i id="thp"></i></div></div>
  <div id="bottom">
    <div class="orb hp"><i id="hpf"></i><span id="hpt"></span></div>
    <div id="mid">
      <div id="xpb"><i id="xpf"></i></div>
      <div id="btns">
        <button data-b="s0" id="sk0" aria-label="Compétence 1"></button>
        <button data-b="s1" id="sk1" aria-label="Compétence 2"></button>
        <button data-b="s2" id="sk2" aria-label="Compétence 3"></button>
        <button data-b="s3" id="sk3" aria-label="Compétence 4"></button>
        <button data-b="s4" id="sk4" aria-label="Compétence 5" class="hidden"></button>

function weekNo(t){return Math.floor(((t==null?Date.now():t)/86400000+3)/7);}
function mutation(t){const w=weekNo(t);let h=w*2654435761>>>0;h^=h>>>13;return MUTATIONS[(h>>>0)%MUTATIONS.length];}
function mut(id){return!!(S&&!S.noMut&&mutation(S.mutT).id===id);}

function useOrb(k,it,sealKey){const why=orbWhy(k,it);if(why){say(why);return null;}if(!(p.orbs||{})[k]){say('Tu n’as pas cet orbe.');return null;}
  let msg='';const keep=it.seal&&it.aff[it.seal]!=null?it.seal:null;
  if(k==='braise'){it.rar=1;const n=ri(1,2);for(let i=0;i<n;i++)addAffOrb(it);sufFix(it);msg='L’objet devient magique.';}
  else if(k==='ecume'){for(const a of ownAff(it))if(a!==keep)dropAff(it,a);const n=ri(1,2);for(let g=0;g<30&&ownAff(it).length<n&&addAffOrb(it);g++);sufFix(it);msg='Nouveaux bonus.';}
  else if(k==='oubli'){for(const a of ownAff(it))dropAff(it,a);it.rar=0;delete it.suf;delete it.rname;delete it.seal;msg='L’objet redevient normal.';}
  else if(k==='cendre'){it.rar=2;it.rname=`${pick(RARE_A)} ${pick(RARE_B)}`;delete it.suf;addAffOrb(it);msg='L’objet devient rare.';}
  else if(k==='vide'){const c=ownAff(it).filter(a=>a!==keep);const a=pick(c);dropAff(it,a);sufFix(it);msg='Bonus retiré : '+AFX[a].t(1).replace(/^\+?1 ?%? ?/,'');}
  else if(k==='tumulte'){for(const a of ownAff(it))if(a!==keep)dropAff(it,a);const n=ri(3,5);for(let g=0;g<40&&ownAff(it).length<n&&addAffOrb(it);g++);msg='Tous les bonus ont changé.';}
  else if(k==='poids'){const B=baseAff(it);for(const a of ownAff(it)){if(a==='allSk')continue;let v=AFX[a].f(Math.max(1,it.ilvl));if(it.rar===3)v=Math.round(v*1.3);it.aff[a]=v+(B[a]||0);}msg='Les valeurs ont changé.';}
  else if(k==='elev'){it.vl=it.vl??it.ilvl;/* v6.45 : comme la forge, le prix de revente ne monte pas */const f=G(p.lvl)/G(it.ilvl),up=v=>Math.max(1,Math.round(v*f));if(it.d)it.d=it.d.map(up);if(it.a)it.a=up(it.a);for(const a of['dmg','life','armor'])if(it.aff[a])it.aff[a]=up(it.aff[a]);if(it.aff.mana)it.aff.mana+=Math.floor((p.lvl-it.ilvl)/4);it.ilvl=p.lvl;msg='Objet remonté au niveau '+p.lvl+'.';}
  else if(k==='serment'){if(!sealKey||!ownAff(it).includes(sealKey)){say('Choisis le bonus à sceller.');return null;}it.seal=sealKey;msg='Bonus scellé : '+AFX[sealKey].t(it.aff[sealKey]);}
  else if(k==='aube'){const a=addAffOrb(it);msg=a?'Nouveau bonus : '+AFX[a].t(it.aff[a]):'Rien à ajouter.';}
  if(ORB_FP.includes(k))it.fp=fpOf(it)-1;p.orbs[k]--;if(!p.orbs[k])delete p.orbs[k];it.val=Math.round((6+(it.vl??it.ilvl)*3)*(1+it.rar*1.6));capItem(it);refreshName(it);if(p.eq&&Object.values(p.eq).includes(it))recalc();S.orbsUsed=(S.orbsUsed||0)+1;return msg;}
function orbTrade(k){const c=ORB_TRADE[k];if(!c||!canPay(c)){say('Pas assez de matériaux.');return false;}for(const m in c)p.mats[m]-=c[m];addOrb(k);return true;}
/* v6.57 : craft de précision. Les orbes restent le hasard ; les essences ajoutent la précision.
   Démolisseur : extraire une propriété d’un objet (détruit) en essence. Forgeronne : poser l’essence sur un objet (place libre ou propriété remplacée).
   Chaque objet a 3 points de forge ; un transfert en coûte un ; à zéro, l’objet est fini. Une case de relique par objet. */
const FP_MAX=3,ESS_MAX=30,ESS_RF={1:.7,2:.85,3:1};
function fpOf(it){return it&&it.fp!=null?it.fp:FP_MAX;}
function essOf(it,k){if(!it||!it.aff||!ownAff(it).includes(k))return null;const B=baseAff(it)[k]||0,rf=(it.set||it.uniq)?1:(ESS_RF[it.rar]||0);if(!rf)return null;const v=Math.max(1,Math.round((it.aff[k]-B)*rf));return{k,v,L:it.ilvl,r:it.uniq||it.set?3:it.rar};}
function essTxt(e){return AFX[e.k]?AFX[e.k].t(e.v):'?';}
function essExtract(it,k){if(!it||it.lock||it.corr)return null;const i=p.bag.indexOf(it);if(i<0)return null;p.ess=p.ess||[];if(p.ess.length>=ESS_MAX){say(`Tu gardes déjà ${ESS_MAX} essences : pose-en chez ${npcF('hilde').replace(/<\/?b>/g,'')}.`);return null;}const e=essOf(it,k);if(!e)return null;p.bag.splice(i,1);p.ess.push(e);return e;}
function essCost(it){return{gold:Math.round(30*G(Math.max(1,it.ilvl||1))),mats:(it.rar>=2||it.set||it.uniq)?{ember:2}:{shard:2}};}
function essRoom(it){return it.rar>=2||it.set||it.uniq?6:2;}
function essWhy(e,it){if(!e||!it)return'Choisis un objet et une essence.';if(it.corr)return'Objet corrompu : plus rien ne le change.';if(fpOf(it)<=0)return'Plus de points de forge : cet objet est fini.';const A=AFX[e.k];if(!A||!A.sl.includes(it.slot))return'Cette essence ne va pas sur ce type d’objet.';if(A.rare&&it.rar<2&&!it.set&&!it.uniq)return'Il faut un objet rare ou mieux.';
  const B=baseAff(it)[e.k]||0,own=ownAff(it);if(own.includes(e.k)&&it.aff[e.k]-B>=e.v)return'Ce bonus est déjà aussi fort.';const c=essCost(it);if(p.gold<c.gold||!canPay(c.mats))return'Pas assez d’or ou de matériaux.';return'';}
function essFull(e,it){return!ownAff(it).includes(e.k)&&ownAff(it).length>=essRoom(it);}
function essApply(i,it,rep){const e=(p.ess||[])[i];const w=essWhy(e,it);if(w){say(w);return null;}if(essFull(e,it)){if(!rep||!ownAff(it).includes(rep)||rep===it.seal){say('Objet plein : choisis la propriété à remplacer.');return null;}dropAff(it,rep);}
  const c=essCost(it);p.gold-=c.gold;for(const m in c.mats)p.mats[m]-=c.mats[m];const B=baseAff(it)[e.k]||0,cur=it.aff[e.k]!=null?it.aff[e.k]-B:0;
  if(it.rar===0){it.rar=1;}it.aff[e.k]=B+Math.max(cur,e.v);it.fp=fpOf(it)-1;p.ess.splice(i,1);sufFix(it);capItem(it);refreshName(it);if(p.eq&&Object.values(p.eq).includes(it))recalc();S.essUsed=(S.essUsed||0)+1;return AFX[e.k].t(it.aff[e.k]);}

const ACTIVE=Object.keys(SK).filter(k=>!SK[k].pas);
/* v6.13 : rendements décroissants des rangs. Jusqu’au rang 5, chaque rang compte en entier ; du 6e au 15e, 60 % ; au-delà, 35 %.
   Un talent monté à 40 rangs agit comme un rang 20 (au lieu de 40). Les points dépensés ne changent pas. */
function effL(l){l=+l||0;if(l<=5)return l;if(l<=15)return 5+(l-5)*.6;return 11+(l-15)*.35;}
function skRaw(id){const b=p.sk[id]||0;if(!b)return 0;return b+(p.st?p.st.allSk:0);}
function skLvl(id){return effL(skRaw(id));}
function branchPts(b){let n=0;for(const k in p.sk)if(SK[k]&&SK[k].br===b)n+=p.sk[k];return n;}
function unlocked(id){const s=SK[id];if(s.gem)return true;return p.lvl>=Math.max(TL[s.ti],s.minL||0)&&branchPts(s.br)>=TP[s.ti];}
/* v6.30 : vraies classes. Chacune a ses deux branches au prix normal (les autres coûtent 2 points par rang), ses armes, une force et une faiblesse.
   Un héros d’avant peut rester « libre » (comme avant) jusqu’à ce qu’il choisisse ; choisir rembourse ses talents. */
const CLS={guerrier:{n:'Guerrier',ic:'⚔️',br:[0,2],w:['sword','axe','mace','dagger'],start:{},bar:[null,null],weapon:'sword',
    d:'Encaisse et frappe de près. Le Tourbillon se gagne au niveau 3. +30 % de vie, +20 % d’armure, −20 % de mana. Chaque coup d’arme touche aussi un deuxième monstre collé à lui (60 % des dégâts). Talents : Guerre et Rempart seulement. Épées, haches, masses, dagues.'},
  mage:{n:'Mage',ic:'🔥',br:[1,3],w:['staff','dagger'],start:{fire:1,nova:1},bar:['fire','nova'],weapon:'staff',
    d:'Frappe fort de loin, mais reste fragile. +25 % de mana et de régénération, +15 % de dégâts des sorts, −15 % de vie. Barrière de mana : 25 % des dégâts reçus sont absorbés par la mana tant qu’il en reste (1 point de mana pour 2 de dégâts). Talents : Pyromancie et Ombre seulement. Bâtons, dagues.'},
  archer:{n:'Archer',ic:'🏹',br:[4,3],w:['bow','dagger'],start:{ardente:1,volley:1},bar:['ardente','volley'],weapon:'bow',
    d:'Tire de loin et bouge vite. +10 % de déplacement, +5 % de critique, −10 % de vie. Talents : Archerie et Ombre seulement. Arcs, dagues.'}};
function tCost(id){const c=p&&p.cls&&CLS[p.cls],sk=SK[id];if(!c||!sk||sk.gem||sk.br<0)return 1;return c.br.includes(sk.br)?1:2;}
function clsWeaponOk(t){const c=typeof p!=='undefined'&&p&&p.cls&&CLS[p.cls];return!c||!t||c.w.includes(t);}
/* v6.55 : une classe n’a accès qu’à ses deux branches (un héros libre garde tout) */
function clsOk(id){const sk=SK[id];if(!sk)return false;if(sk.gem||sk.br<0)return true;const c=p&&p.cls&&CLS[p.cls];return !c||c.br.includes(sk.br);}
function myBranches(){const c=p&&p.cls&&CLS[p.cls];return c?c.br.slice():BR.map((_,i)=>i);}
function canRank(id){return clsOk(id)&&p.pts>=tCost(id)&&SK[id]&&!SK[id].gem&&unlocked(id)&&(p.sk[id]||0)<RMAX;}
/* conversion : rembourse les talents d’autres classes (payés 2 points par rang) et les retire de la barre et des préréglages */
function classPrune(){if(!p.cls||!CLS[p.cls])return 0;let back=0;const gone=[];for(const k of Object.keys(p.sk)){if(clsOk(k))continue;back+=(p.sk[k]|0)*2;gone.push(k);delete p.sk[k];}
  p.bar=p.bar.map(k=>k&&!clsOk(k)?null:k);if(p.sup)for(const k of Object.keys(p.sup))if(!clsOk(k))delete p.sup[k];if(p.cds)for(const k of gone)delete p.cds[k];
  if(Array.isArray(p.builds))p.builds.forEach(B=>{if(!B||!B.sk)return;for(const k of Object.keys(B.sk))if(SK[k]&&!SK[k].gem&&SK[k].br>=0&&!CLS[p.cls].br.includes(SK[k].br))delete B.sk[k];if(Array.isArray(B.bar))B.bar=B.bar.map(k=>k&&SK[k]&&!SK[k].gem&&SK[k].br>=0&&!CLS[p.cls].br.includes(SK[k].br)?null:k);});
  p.pts+=back;return back;}
/* Barre : 4 cases, 5 au niveau 15, 6 au niveau 30 */
function barSize(){return 4+(p.lvl>=15?1:0)+(p.lvl>=30?1:0);}
/* v5.47 : Pas du Voile. Butin des Arpenteurs (cartes « Voile déchiré »), 3 charges. */
function veilRe(){return Math.max(4,10-.5*(skLvl('veil')-1));}
function veilStep(tx,ty,l){const z=S.cur;if(p.veilC==null)p.veilC=3;
  if(z.shrink){say('Le Voile refuse de s’ouvrir ici.');return false;}
  if(p.veilC<1){say('Le Voile se referme. Attends une charge.');return false;}

  const F=bfs(z,Math.floor(p.x),Math.floor(p.y),Math.ceil(R*1.6));let dst=null;

 givre:{i:'Ici, le froid est tombé d’un coup, le jour même où tu es arrivé. Les gens de Brumegel disent que tu l’as apporté. Ils n’ont peut-être pas tort.',
  s:['« Varsha a repris forme dans la glace. Les morts qu’elle touche gèlent debout et repartent. Les loups suivent l’odeur du froid. »','« Le froid recule, un peu. Mais les statues gelées ont toutes tourné la tête vers le Sanctuaire. »','« Il s’est relevé dans le blizzard. Les vieux trappeurs disent que chaque hiver a un maître. Celui-ci n’a jamais fondu. »'],
  l:[['Carnet d’un trappeur','« Les loups n’attaquent plus seuls. Ils encerclent, ils attendent, ils hurlent ensemble. Quelqu’un leur a appris. »'],['Lettre gelée','« Si tu trouves cette lettre, je suis la statue à côté. Ne me casse pas. Ou casse-moi vite. »'],['Avis du refuge','« Défense de dormir dehors. Ceux qui dorment dehors se réveillent pierre. »'],['Note de Sœur Nivé','« La glace garde tout : les corps, les voix, les promesses. Elle rendra tout au dégel. Je prie pour qu’il ne vienne jamais. »']]},
 marais:{i:'Le marais a gonflé la nuit de ton arrivée. Les noyés remontent, les feux follets mènent les curieux sous l’eau. Fangebourg tient sur pilotis et sur sa chance.',
  s:['« Varsha s’est refaite dans la boue. Ses acolytes pataugent dans les mares. Les sangsues sont ses yeux. »','« Les eaux baissent, mais ce qui riait sous la vase rit plus fort. Les passeurs refusent d’aller au-delà du Pont des Noyés. »','« Il est remonté de la vase, couvert de lumière. Les passeurs disent que le marais n’est qu’un miroir de quelque chose de plus profond. »'],
  l:[['Billet de passeur','« Prix du passage : une pièce. Prix du retour : on n’en a jamais parlé, personne ne revient. »'],['Recette de la sorcière','« Pour faire taire un noyé : du sel, son vrai nom, et courir. Surtout courir. »'],['Lettre mouillée','« Ma chérie, le feu follet m’a mené à un coffre plein d’or. Je reviens demain le chercher. Je suis tellement près. »'],['Journal de Mère Aulne','« Les chapardeurs ne volent pas pour eux. Ils rapportent tout à quelque chose sous les pilotis. »']]},
 pre:{i:'On racontait aux enfants que les licornes vivaient ici. C’était vrai. Elles y sont mortes, et la nuit dernière, elles se sont relevées.',
  s:['« La Jument blême mène le troupeau. Elle cherche le cavalier qui l’a abandonnée. Les écorcheurs vendent leurs cornes. »','« La Jument est retombée. Le troupeau fantôme galope encore, mais plus vers nous : vers le Sanctuaire. »','« Couronné de cornes brisées… Les contes d’enfants avaient raison : il y a toujours quelqu’un au bout de l’histoire. »'],
  l:[['Conte de nourrice','« Si tu entends des sabots sans voir de chevaux, couche-toi dans l’herbe et retiens ton souffle. »'],['Reçu d’un écorcheur','« Une corne entière : cinquante pièces. Une corne qui luit encore : cent. Une qui chante : ne l’achète pas. »'],['Lettre d’une palefrenière','« J’ai soigné la Jument quand elle était vivante. Elle me reconnaît encore. C’est pire. »'],['Note de Frère Osric','« Les licornes ne sont pas mortes de vieillesse. Quelqu’un les a testées, une par une. »']]},
 fonte:{i:'Ici, on fondait les saints pour en faire des machines. Les machines ont continué sans nous. L’Atelier en ruine est tout ce qui reste des fondeurs.',
  s:['« La Mère-Fonderie coule encore ses enfants de laiton. Ses acolytes huilent ses rouages avec ce qu’ils trouvent. »','« Elle s’est figée. Pourtant les automates continuent leur ronde. Quelqu’un les remonte, plus bas. »','« Couvert d’or fondu… Les fondeurs disaient qu’on ne fond pas ce qui refuse de mourir. Ils parlaient de lui. »'],
  l:[['Fiche de coulée','« Saint numéro 412 : refus de fondre. Recommencer à plus haute température. »'],['Lettre d’un apprenti','« Le contremaître dit que les automates ne pensent pas. Alors pourquoi celui de la cour me salue-t-il tous les matins ? »'],['Plan griffonné','« La soupape quatre ne doit jamais s’ouvrir. Personne n’a dit pourquoi. »'],['Note de Maître Aubertin','« Le Premier Fondeur a coulé son propre visage dans le bronze. Puis il l’a donné à quelqu’un qui n’en avait pas. »']]},
 ossu:{i:'Ici, on enterrait les morts sous les cloches pour qu’ils n’entendent plus rien. Ils entendent quand même. La Chapelle basse est le dernier lieu où l’on prie.',
  s:['« Le Grand Bourdon sonne, et les morts répondent. Les moines fous gardent ses acolytes dans les catacombes. »','« Il s’est fêlé et tu. Mais chaque nuit, une cloche sonne encore, plus bas, une seule fois. »','« Il s’est relevé dans le fracas des cloches. Les moines pendaient les cloches vers le bas pour lui. Ils savaient. »'],
  l:[['Registre des morts','« Enterrés ce mois : quarante. Revenus ce mois : quarante et un. Le quarante et unième n’est sur aucune liste. »'],['Lettre d’un sonneur','« Ne sonne jamais la cloche sans corde. Je l’ai fait une fois. Quelqu’un a répondu. »'],['Prière sans fin','« … et que le glas nous compte, et qu’il se trompe, et qu’il se trompe encore, et… »'],['Note de Frère Anselme','« Les moines n’étaient pas fous. Ils avaient entendu la dernière cloche. Celle qui sonne pour celui qui teste. »']]},
 astre:{i:'Ici, on forgeait les étoiles. Puis on a forgé autre chose. Ce qui brille n’est pas toujours bon, et la lumière est la vraie menace.',
  s:['« La Forgeuse d’astres coule des étoiles vivantes. Ses acolytes gardent les prismes qui l’alimentent. »','« Elle s’est figée dans son métal, et le ciel ne s’est pas éteint. Quelqu’un tient la lumière allumée. »','« Couronné de lumière… Les archives parlent d’un client de la Forge, il y a mille ans. Il avait commandé un escalier. »'],
  l:[['Bon de commande','« Une étoile, taille moyenne, couleur chaude. Livraison : quand elle sera prête. Signé : un client patient. »'],['Lettre d’un copiste','« Les archives se réécrivent la nuit. Ce matin, mon nom n’y était plus. »'],['Avertissement','« Ne regarde pas le gardien quand il devient argenté. Ce que tu lui lances, il te le rend. »'],['Note de l’Archiviste','« Chaque monde est une marche. Ici, on a forgé la lumière pour éclairer la suivante. »']]},
 foret:{i:'La forêt d’Ambreval s’est refermée sur les villages. Les cerfs chargent les chasseurs, les ronces poussent dans la nuit, et le cerf blanc a été revu.',
  s:['« La Sylve-Mère a pris racine au cœur de la forêt. Ses gardiens sont des bêtes, et les braconniers leur vendent des captifs. »','« La Sylve-Mère s’est desséchée, mais les racines continuent de pousser vers le bas. Vers quelque chose. »','« Il s’est relevé couvert de mousse. Le vieux Gaspard dit que la forêt ne meurt jamais, elle change de maître. »'],
  l:[['Carnet de chasse','« Le cerf blanc s’arrête toujours pour souffler. Toujours au même endroit. Comme s’il attendait quelqu’un. »'],['Lettre d’un bûcheron','« Les arbres que j’abats repoussent pendant la nuit. Hier, l’un d’eux avait mon visage dans l’écorce. »'],['Note de braconnier','« Une archère des futaies vaut plus qu’une peau d’ours. Mais elle te regarde. Tout le temps. »'],['Herbier de Sœur Fougère','« Mousse rouge : guérit. Mousse noire : fait dormir. Mousse qui bouge : ne pas cueillir. »']]},
 desert:{i:'Le soleil de Solmar ne se couche plus vraiment. Les scorpions sortent par centaines, et la Reine pond sous les dunes.',
  s:['« La Reine-Scorpion pond sans fin. Ses gardiens tiennent le sceau du nid, et les pillards profitent des tempêtes. »','« La Reine est morte. Les caravanes repartent, mais elles évitent toutes la même direction. »','« Il s’est relevé ruisselant de sable. Les caravaniers ont un mot pour ça : le mirage qui marche. »'],
  l:[['Livre de caravane','« Jour quarante. L’oasis était un mirage. Le mirage avait soif lui aussi. »'],['Lettre d’un pillard','« On pille pendant les tempêtes. Mais la dernière fois, quelqu’un pillait avec nous. Il n’avait pas d’ombre. »'],['Inscription d’obélisque','« Ici dorment les rois qui ont refusé le test. Ils dorment mal. »'],['Note de Vieille Zahira','« Le sable garde la trace de chaque pas. Les siens vont tous vers le bas. »']]},
 volcan:{i:'Le Mont Ardent s’est réveillé. Les gelées de feu coulent avec la lave, et quelque chose de grand vole au-dessus du cratère.',
  s:['« Pyrrha dort au fond de la caldeira. Ses gardiens bouchent les évents pour qu’elle ne se refroidisse jamais. »','« La dragonne est tombée. La montagne devrait se rendormir. Elle ne se rendort pas. »','« Il s’est relevé rouge comme une forge. La Doyenne dit que les volcans ne sont que des bouches. Celle-ci parlait pour lui. »'],
  l:[['Rapport de garde','« Le dragonnet a craché sur la sentinelle. La sentinelle a ri. Puis elle a pris feu. Puis elle a continué de rire. »'],['Lettre de la forgeronne','« Je forge avec la lave du cratère. Mes lames sont meilleures, mais elles chuchotent. »'],['Avis du refuge','« Si le sol rougit, compte jusqu’à un, puis cours. Si tu as compté jusqu’à deux, salue Pyrrha pour nous. »'],['Note de Doyenne Ignis','« Pyrrha n’était pas méchante. Elle couvait un œuf que quelqu’un d’autre avait pondu. »']]},
 abime:{i:'Ici, la terre hurle. Les molosses à trois têtes chassent en meute et les diablotins rient dans le noir. Le Dernier Bastion porte bien son nom.',
  s:['« La Mère des Molosses garde le chenil. Ses geôliers tiennent le sceau avec des chaînes forgées en bas. »','« Elle est tombée. Les meutes se dispersent, mais elles reviennent toujours vers le même trou. »','« Il s’est relevé couronné de cornes noires. Même ici, au fond de tout, il y a encore plus bas. Il l’a dit lui-même. »'],
  l:[['Registre du geôlier','« Prisonnier numéro un : moi. J’ai perdu la clé le premier jour. »'],['Lettre d’un damné','« Je ne me souviens plus de ma faute. Je me souviens seulement qu’on m’a proposé un test, et que j’ai dit non. »'],['Graffiti','« LES DIABLOTINS RIENT PARCE QU’ILS SAVENT. »'],['Note de Frère Anselme','« J’ai suivi les cloches jusqu’ici. Il n’y a plus de cloches. Il n’y a que lui, qui attend en souriant. »']]}};
const CARNET_FROM='Ces pages viennent du carnet d’Edern, un cartographe qui a suivi la cendre avant toi, de monde en monde. Il les a semées en route pour ne pas oublier son nom.';
function loreTh(){return curWorld().theme;}
function loreStage(){const q=S.q||{};return q.q5&&q.q5.s>=2?2:q.q3&&q.q3.s>=2?1:0;}
function loreNew(){const k=loreTh()+loreStage();return!(S.loreSeen||{})[k];}
function lorePanel(){const L=LORE[loreTh()];if(!L)return;S.loreSeen=S.loreSeen||{};const st=loreStage();S.loreSeen[loreTh()+st]=1;save();
  openPanel(`<h2>${npcF('corvel')}</h2><p class="st">${L.i}</p>${L.s.slice(0,st+1).map((t,i)=>`<p class="say"${i<st?' style="opacity:.6"':''}>${t}</p>`).join('')}<p class="st">Lettres de ce monde trouvées : ${letCount(loreTh())} / 4 (sur les dépouilles d’aventuriers et au bout des chemins de traverse). Tout est rangé dans l’onglet Histoire.</p><button data-a="tab" data-t="histoire">Onglet Histoire</button><button data-a="close">Fermer</button>`);}
function letCount(th){return Object.keys(((S.letters||{})[th])||{}).length;}
function letterGive(z,x,y){const th=z.palTheme||loreTh(),L=LORE[th];if(!L)return false;S.letters=S.letters||{};const got=S.letters[th]=S.letters[th]||{};const i=[0,1,2,3].find(k=>!got[k]);if(i==null)return false;
  got[i]=1;sfx('leg');toast('Lettre trouvée : '+L.l[i][0]);S.pend.push({t:.4,fn:()=>letterRead(th,i)});save();return true;}
function letterRead(th,i){const L=LORE[th];if(!L||!L.l[i])return;openPanel(`<h2>${L.l[i][0]}</h2><p class="say" style="font-style:italic">${L.l[i][1]}</p><p class="st">${THEMES[th].n} · lettre ${i+1} sur 4.</p><button data-a="tab" data-t="histoire">Onglet Histoire</button><button data-a="close">Refermer</button>`);}
function histoireHTML(){const P=S.pages||{},n=PAGES.filter((_,i)=>P[i]).length;let h=`<h2>Histoire</h2><p class="st">Tout ce que tu as appris. Rien n’est obligatoire : c’est pour ceux qui veulent savoir.</p>`;
  h+=`<h3>Le carnet d’Edern : ${n} / ${PAGES.length}</h3><p class="st">${CARNET_FROM} Les pages tombent des coffres et des boss.${n>=PAGES.length?' <b style="color:#e8c46a">Carnet complet.</b>':` Les ${PAGES.length} pages réunies révèlent son dernier mot (et un point de talent).`}</p><button class="min" data-a="tab" data-t="carnet">Lire le carnet</button>`;
  for(let w=1;w<=7;w++){const W_=WORLDS[w];if(!W_)continue;const th=W_.theme,L=LORE[th];if(!L)continue;const seen=w<=(S.worldMax||1);
    h+=`<h3>Monde ${w} : ${seen?THEMES[th].n:'?'}</h3>`;if(!seen){h+='<p class="st" style="color:#6b604e">Pas encore visité.</p>';continue;}
    const st=w===S.world?loreStage():(((S.qw||{})[w]||{}).q5&&S.qw[w].q5.s>=2?2:((S.qw||{})[w]||{}).q3&&S.qw[w].q3.s>=2?1:0);h+=`<p class="st">${L.i}</p><p class="say">${L.s[st]}</p>`;
    const got=((S.letters||{})[th])||{};h+=`<div>${L.l.map((x,i)=>got[i]?`<button class="min" data-a="letter" data-th="${th}" data-k="${i}">✉ ${x[0]}</button>`:`<button class="min" disabled style="opacity:.4">✉ ?</button>`).join('')}</div>`;}
  return h;}
function pageDrop(z,x,y,ch){S.pages=S.pages||{};const left=PAGES.map((_,i)=>i).filter(i=>!S.pages[i]&&!z.items.some(o=>o.kind==='page'&&o.i===i));if(!left.length||Math.random()>=ch)return false;dropAt(z,x,y,{kind:'page',i:left[0]});return true;}
function pageRead(i){const P=PAGES[i];if(!P)return;const n_=PAGES.filter((_,k)=>(S.pages||{})[k]).length;openPanel(`<h2>Carnet : ${P.t}</h2>${n_<=1||i===0?`<p class="st">${CARNET_FROM}</p>`:''}<p class="say" style="font-style:italic">« ${P.x} »</p><p class="st">Page ${i+1} sur ${PAGES.length} · tu en as ${n_}. ${n_>=PAGES.length?'Carnet complet.':'Toutes réunies : son dernier mot, et un point de talent.'}</p><button data-a="close">Refermer</button>`);}
/* v5.61 : contrats du jour. Trois petits contrats au tableau du camp, nouveaux chaque jour. */
const CONTRACTS={kill:{n:g=>`Abattre ${g} monstres`,g:[120,200]},champ:{n:g=>`Abattre ${g} champions`,g:[6,12]},chest:{n:g=>`Ouvrir ${g} coffres`,g:[6,10]},
  event:{n:g=>`Terminer ${g} événement${g>1?'s':''}`,g:[1,2]},trial:{n:()=>'Réussir une épreuve',g:[1,1]},rift:{n:()=>'Vaincre une faille',g:[1,1]},boss:{n:()=>'Vaincre un boss ou un acolyte',g:[1,1]}};
function dayNo(t){return Math.floor((t==null?Date.now():t)/86400000);}
function ctToday(){const d=dayNo(S.ctT);if(!S.ct||S.ct.day!==d){let h=(d*2246822519)>>>0;const R=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};const ks=Object.keys(CONTRACTS),list=[];
    while(list.length<3){const k=ks[Math.floor(R()*ks.length)];if(list.some(c=>c.k===k))continue;const G_=CONTRACTS[k].g;list.push({k,goal:Math.round(G_[0]+(G_[1]-G_[0])*R()),cnt:0,claimed:false});}S.ct={day:d,list};}return S.ct;}
function ctTrack(k,n){if(!S||!S.cur)return;try{seaTrack(k,n);}catch(e){}if(k==='champ')S.champK=(S.champK||0)+(n||1);if(k==='boss')S.bossK=(S.bossK||0)+(n||1);const C=ctToday();for(const c of C.list)if(c.k===k&&c.cnt<c.goal){c.cnt=Math.min(c.goal,c.cnt+(n||1));if(c.cnt>=c.goal)S.pend.push({t:.6,fn:()=>{toast('Contrat rempli : '+CONTRACTS[k].n(c.goal));sfx('lvl');}});}}
function ctReward(){const L=p.lvl;return{gold:Math.round(120+L*25),mats:L>=20?{shard:2,ember:1}:{dust:4,shard:1}};}
function boardPanel(){const M=mutation(S.mutT),C=ctToday(),R_=ctReward();
  openPanel(`<h2>Mutation de la semaine</h2><p class="it" style="color:#e06a2b">${M.n}</p><p>${M.d}</p><p class="st">La même pour tous les joueurs. Elle change chaque lundi.</p>
  <h2>Contrats du jour</h2><p class="st">Récompense de chacun : ${fmt(R_.gold)} or et ${matsTxt(R_.mats)}. Nouveaux contrats demain.</p>
  ${C.list.map((c,i)=>`<div class="row"><div><div class="it" style="color:${c.claimed?'#6a6050':c.cnt>=c.goal?'#e8c46a':'#e2d6c0'}">${CONTRACTS[c.k].n(c.goal)}</div><div class="st">${c.claimed?'Payé':`${c.cnt} / ${c.goal}`}</div></div><div class="bt">${!c.claimed&&c.cnt>=c.goal?`<button class="min" data-a="ctclaim" data-k="${i}">Toucher</button>`:''}</div></div>`).join('')}
  <button data-a="close">Fermer</button>`);}

const NEWS=[{"v": "5.41", "t": "Le camp s’anime : trois survivants, un chat et des oiseaux."}, {"v": "5.42", "t": "Le camp devient une île de roc qui flotte au-dessus de la cendre."}, {"v": "5.43", "t": "Compagnons : évolution jusqu’à Légendaire chez le recruteur, un talent par rang."}, {"v": "5.44", "t": "Nouvelle épreuve : Convoi, escorter un chariot de reliques."}, {"v": "5.45", "t": "Nouvelle épreuve : Proie, une chose te traque, trouve trois clés."}, {"v": "5.46", "t": "Objets corrompus chez le Démolisseur : un essai, gros gain ou poussière."}, {"v": "5.47", "t": "Pas du Voile : téléportation à 3 charges, butin des Arpenteurs."}, {"v": "5.48", "t": "Arme de rechange : bouton ⇄ (ou X) pour changer d’arme."}, {"v": "5.49", "t": "Nouvelles zones : Descente et Cendre qui avance."}, {"v": "5.50", "t": "Nouveaux événements : Puits des murmures, Colporteur égaré, Gibet."}, {"v": "5.51", "t": "Monde 6 : l’Ossuaire des Cloches."}, {"v": "5.52", "t": "Hauts faits, dans l’onglet Exploits."}, {"v": "5.53", "t": "Événements d’élites ou de nuit."}, {"v": "5.54", "t": "Nouveaux monstres : Nécromant, Rampant des fosses, Porte-lanterne."}, {"v": "5.55", "t": "Huit légendaires de plus."}, {"v": "5.56", "t": "Trois ensembles de plus : Guetteur, Ombre, Glas."}, {"v": "5.57", "t": "Pierres : Faux spectrale, Chaînes d’os ; soutiens Embrasement et Célérité."}, {"v": "5.58", "t": "Quatre mutations de la semaine de plus."}, {"v": "5.59", "t": "Le carnet : douze pages à retrouver."}, {"v": "5.60", "t": "La Mère des Cendres change avec les mondes : ondes à éviter."}, {"v": "5.61", "t": "Contrats du jour au tableau du camp."}, {"v": "5.62", "t": "Affixes de faille dès la faille 5."}, {"v": "5.63", "t": "Ce panneau : les nouveautés depuis ta dernière partie."}, {"v": "5.64", "t": "Valgris change avec les mondes : lances de cendre, puis ondes de glas."}, {"v": "5.65", "t": "Mini-carte : coffres, clés, chariot, sanctuaire, compagnon et la chose qui te traque."}, {"v": "5.66", "t": "Acolytes et lieutenants changent avec les mondes : lances de cendre, renforts."}, {"v": "5.67", "t": "Graphismes : couleurs par monde, grain, murs ombrés, ombres portées, sols tachés, monstres plus détaillés, traînées de sorts."}, {"v": "5.68", "t": "Graphismes : squelettes en os fins, fantômes avec halo et volutes, mages encapuchonnés, lanternes."}, {"v": "5.69", "t": "Graphismes : les monstres s’effondrent en mourant ; réglage Hauts, Normaux ou Économie dans les Stats."}, {"v": "5.70", "t": "Graphismes : la Mère des Cendres redessinée, ailes à baleines d’os et fissures qui respirent."}, {"v": "5.71", "t": "Graphismes : arc de taille au corps à corps et éclats aux impacts."}, {"v": "5.72", "t": "Décors : bougies dans les cryptes, gravats, stalagmites dans les antres."}, {"v": "5.73", "t": "Butin au sol dessiné selon sa nature, et rayons de couleur pour les objets rares, d’ensemble et légendaires."}, {"v": "5.74", "t": "Météo : pluie sur les marais, neige sur le givre, cendre qui tombe sur l’Ossuaire."}, {"v": "5.75", "t": "Sorts : ondes en double anneau à la couleur du sort, éclats de glace, éclairs lumineux et ramifiés."}, {"v": "5.76", "t": "Personnages du camp plus vivants : bras qui bougent, mains, visage, plis de robe."}, {"v": "5.77", "t": "Poussière sous les pas du héros, braises qui montent des coulées dans les antres."}, {"v": "5.78", "t": "Monde 7 : la Forge céleste, or blanc et lumière froide."}, {"v": "5.79", "t": "Sons plus riches : chocs, critiques, blessures, explosions et râles des monstres qui tombent."}, {"v": "5.80", "t": "Nouvelle branche de talents : l’Archerie, avec la Flèche ardente, la Salve et la Tempête de flèches."}, {"v": "5.81", "t": "Compagnons : un anneau de couleur sous leurs pieds montre leur rang."}, {"v": "5.82", "t": "Butin : filtre à trois niveaux (tout, sans les normaux, rares et plus) et bouton « Tout au coffre »."}, {"v": "5.83", "t": "Un guide dans les Stats : neuf fiches courtes sur le camp, les failles, les épreuves, les objets et le reste."}, {"v": "5.84", "t": "Qualité adaptative : si le téléphone peine en graphismes hauts, le jeu passe tout seul en normaux."}, {"v": "5.85", "t": "Trois événements de plus : Chapelle profanée, Cage du geôlier, Tombe fraîche."}, {"v": "5.86", "t": "Monstres propres à quatre mondes : Spectre de givre, Noyé, Sonneur, Ange de laiton."}, {"v": "5.87", "t": "Copie de secours de ta partie dans les Stats : un texte à garder ailleurs, et à recoller pour tout retrouver."}, {"v": "5.88", "t": "Monde 5 : l’Automate de laiton, six plaques à faire sauter avant qu’il saigne."}, {"v": "5.89", "t": "Apparence du héros dans les Stats : peau, cheveux, couleur de cape, casque caché."}, {"v": "5.90", "t": "Valgris en trois formes (deux bras de plus, puis ailes d’os et couronne de cornes), et une révélation finale bien plus longue."}, {"v": "5.91", "t": "Monde vivant : l’ombre d’un dragon qui passe, chauves-souris, corbeaux, comètes, éclairs, aurore, nappes de brouillard."}, {"v": "5.92", "t": "Détails partout : fissures, mousse, toiles d’araignée, chaînes et pierres sur les murs ; cailloux, touffes, glace, champignons, ossements au sol ; foin et gravats dans les plaines."}, {"v": "5.93", "t": "Vraie marche : le héros avance une jambe après l’autre, lève le pied et balance les bras ; les monstres marchent aussi."}, {"v": "5.94", "t": "Cartes plus vivantes : urnes, tonneaux et caisses à casser, et barils de poudre qui explosent sur les monstres."}, {"v": "5.95", "t": "Évents du décor : le sol crache du feu, du givre ou du gaz toutes les quelques secondes (un cercle l’annonce). Ils blessent aussi les monstres : attire-les dessus. Les coups d’arme cassent les urnes."}, {"v": "5.96", "t": "Météo : cendre qui tombe et braises qui montent, neige dans le Givre, pluie fine sur les marais, poussières lumineuses ailleurs. Flammes lointaines qui dansent au bas de l’écran dans les mondes de braise."}, {"v": "5.97", "t": "Dépouilles d’aventuriers à fouiller (butin et un mot laissé avant de mourir) et leviers qui font glisser un pan de mur sur un coffre caché."}, {"v": "5.98", "t": "Petites bêtes : rats, lièvres blancs, grenouilles, lézards de forge, papillons de nuit et lucioles. Elles détalent quand tu approches."}, {"v": "5.99", "t": "Les monstres tués basculent sur le côté et restent couchés un instant. Le héros laisse des empreintes dans la neige, la cendre et la boue."}, {"v": "6.00", "t": "Lumière et eau : des rayons tombent des failles du plafond dans les cryptes et les antres, avec de la poussière qui y danse. Flaques dans les plaines (glace dans le Givre) : elles reflètent le ciel, frissonnent sous la pluie et éclaboussent sous tes pas."}, {"v": "6.01", "t": "Végétation vivante : herbes, roseaux, ronces, fleurs de givre et cristaux. Ils ondulent au vent et se couchent quand tu passes dedans."}, {"v": "6.02", "t": "Début de partie plus dur : les monstres frappent plus fort jusqu’au niveau 30, l’armure compte moins contre les petits monstres, moins de vie fixe sur les nouveaux objets, groupes plus gros dans les premières zones."}, {"v": "6.03", "t": "Expérience : courbe plus raide au début, beaucoup moins d’expérience pour les monstres de 2 niveaux et plus sous le héros, un peu plus pour ceux au-dessus. Ta barre d’expérience a été convertie : tu gardes ton niveau et ton pourcentage."}, {"v": "6.04", "t": "Butin : moins d’objets, deux fois moins de rares et de légendaires sur les monstres, coffres et dépouilles moins généreux, rendements décroissants sur la découverte d’objets. En échange : plus d’or, et le Démolisseur rend plus de matériaux. Les cartes d’épreuve ne tombent plus avant la mort de Varsha, et deux fois moins souvent ensuite."}, {"v": "6.05", "t": "Nova de givre : les dégâts suivent l’anneau visible et s’arrêtent aux murs, un peu moins forte et moins loin. Plus de saccade quand beaucoup de monstres meurent d’un coup : butin et effets arrivent sur les images suivantes."}, {"v": "6.06", "t": "Murs : plus aucune attaque ne passe à travers un mur ou un coin de mur (monstres, compagnon, héros, sorts de zone). Un monstre qui ne te voit pas te contourne. Avec un arc, le héros contourne au lieu de tirer dans le mur. Le coffre maudit, la cage, le gibet et le puits font apparaître leurs monstres de ton côté du mur."}, {"v": "6.07", "t": "Valgris en trois formes : chaque forme a sa propre barre de vie, pleine, avec son numéro. Entre deux formes, il s’effondre, un silence, une réplique, puis il se relève plus grand. Le combat entier dure à peu près comme avant."}, {"v": "6.08", "t": "Barre du bas centrée : les deux bulles restent entières sur les petits écrans (bords arrondis et encoches compris). En touchant une compétence, son nom s’écrit en transparence au-dessus du bouton puis s’efface ; au toucher long : coût, recharge et effet."}, {"v": "6.09", "t": "Effets de zone : la bannière d’entrée reste 3 secondes de plus, et les effets restent écrits en petit sous la mini-carte (touche-les pour le détail). Le ciel est accroché à la carte : aurore et comètes derrière les bords du haut, flammes lointaines derrière les bords du bas, avec un défilement plus lent ; oiseaux et chauves-souris volent au-dessus du sol et défilent avec lui."}, {"v": "6.10", "t": "Inventaire : touche deux fois un objet du sac pour l’équiper (un anneau va dans l’emplacement vide, sinon remplace le plus faible) ; deux fois sur la poupée pour le renvoyer au sac. Le Démolisseur montre un encadré « Tes matériaux » : à quoi ils servent et ce que coûte chaque travail. Le recruteur rappelle ce que coûte l’évolution du compagnon."}, {"v": "6.11", "t": "Orbes de forge : dix orbes qui tombent en butin (surtout sur les champions et les boss) et qu’on pose sur un objet : rendre magique ou rare, relancer les bonus ou seulement leurs valeurs, ajouter ou retirer un bonus, remettre à normal, monter au niveau du héros, sceller un bonus contre les relances. Le Démolisseur les échange contre ses matériaux. Sacoche d’orbes dans le sac."}, {"v": "6.12", "t": "Actes plus longs : 8 zones avant l’antre au lieu de 5 (pour les nouvelles parties et les mondes pas encore visités). Chemins de traverse : 4 zones facultatives par acte, branchées sur le chemin principal (entrées en bleu sur la mini-carte), chacune avec sa mission : abattre un chef, réveiller quatre pierres, vider une crypte, trouver une malle. Elles paient : une archère qui te suit, un point de talent pour toujours, un sac plus grand, des orbes, une pièce d’ensemble, un légendaire. Suivi dans l’onglet Quêtes."}, {"v": "6.13", "t": "Plus dur et plus long : Valgris a trois fois plus de vie (chaque forme a la vie entière d’avant) et frappe plus fort ; ses dernières paroles s’écrivent en grand, par-dessus tout. Les talents ont des rendements décroissants (en entier jusqu’au rang 5, 60 % jusqu’au 15, 35 % ensuite). Les niveaux montent plus lentement. Les cartes sont plus grandes, avec plus de monstres."}, {"v": "6.14", "t": "Un nouveau PNJ au camp, la lapidaire : elle pose les orbes (choisis l’objet, puis l’orbe, avec la raison quand un orbe ne va pas), les échange contre des matériaux et montre la sacoche. Le Démolisseur devient le forgeron des matériaux, en trois onglets : Démolir, Retravailler, Matériaux. Un bouton ✕ pour fermer reste toujours en haut des fenêtres. Le menu est découpé en onglets courts : Sac, Stats, Réglages, Talents, Pierres, Quêtes, Traverses, Découvertes, Hauts faits, Carnet, Bestiaire."}, {"v": "6.15", "t": "Onze mondes possibles : forêt (cerfs, sangliers, araignées), désert au gros soleil (scorpions, chacals, Reine-Scorpion), volcan (gelées de feu qui se divisent, dragonnets, Pyrrha la dragonne rousse), abîme (molosses à trois têtes, diablotins). Le givre devient le monde des loups. À chaque nouvelle partie, les sept mondes sont tirés au hasard ; une partie déjà commencée garde les siens."}, {"v": "6.16", "t": "Corrections après une grosse chasse aux bogues : un orbe ne peut plus tourner sans fin sur un objet, la mémoire des sols de zones est rendue tout de suite (moins de risque de plantage sur téléphone après une longue partie)."}, {"v": "6.17", "t": "Nouvelle partie réparée : la page publiée bloquait la question du navigateur. La question est maintenant posée dans le jeu, et l’ancienne partie est gardée de côté (Réglages, Copie de secours, Reprendre la partie d’avant)."}, {"v": "6.18", "t": "Fiches : chaque talent a sa fiche complète (bouton « Fiche complète » dans les talents, ou garder le doigt sur un bouton de la barre) avec les vrais dégâts de ton héros, le coût, la recharge, la portée, ce que fait le rang suivant et ce qui l’améliore. Les statistiques s’expliquent quand on les touche, et le guide est rangé en dix chapitres."}, {"v": "6.19", "t": "Synergies : chaque talent qui frappe est renforcé par 2 ou 3 autres talents (par exemple la Boule de feu gagne 8 % par rang de Météore et 6 % par rang de Pluie de braises), +100 % au plus. La fiche du talent montre les synergies, ce qu’elles donnent déjà, et les talents qu’il renforce."}, {"v": "6.20", "t": "Équipement de build : 26 nouveaux légendaires qui transforment un talent précis (Hache-Tourbillon qui attire, Arc des Cinq Vents, Gantelets du Givre-Foudre, Météore sans recharge…). Ensembles à 6 pièces, dont le bonus multiplie une famille de talents. Nouveau PNJ au camp : l’Autel des empreintes, qui extrait le pouvoir d’un légendaire et le garde actif sans porter l’objet (3 à la fois). La fiche des objets dit quel talent ils améliorent."}];
NEWS.push({v:'6.21',t:'Dix nouvelles attaques chez les ennemis, toutes annoncées avant de frapper : l’araignée de la forêt bondit (son ombre grandit au sol), le fouisseur sort de terre (le sol se fissure), le nouveau Pétardier du volcan lance des bombes (cercle qui se remplit), tourbillons de sable ou de neige qui poussent, la brute des cendres charge en ligne (ligne rouge, assommée contre un mur), pics de glace en ligne, harpon qui te tire (ossuaire), flaques d’acide qui rongent l’armure (marais), tireur au rayon (fil rouge qui se fige), diablotin qui ressort derrière toi dans une fumée noire. La première fois, une phrase explique comment l’éviter.'});
NEWS.push({v:'6.22',t:'Un événement propre à chaque monde, avec sa petite histoire : bûchers des veilleurs (cendres), voyageurs pris dans la glace (givre), feu follet à suivre (marais), troupeau fantôme (pré blême), automate déréglé (fonderie), glas des morts (ossuaire), pluie d’étoiles (forge céleste), chasse au cerf blanc (forêt), tempête de sable (désert), éruption (volcan), meute de l’Abîme. Ils remplacent souvent un événement ordinaire dans les actes pas encore tirés. Le journal ne compte que les événements des mondes de ta partie.'});
NEWS.push({v:'6.23',t:'Huit attaques de plus, toujours annoncées : tireurs en éventail (pré blême), tournoyeurs et mortiers (fonderie), toiles qui immobilisent (forêt), meute de loups qui encercle puis bondit (givre), nova lente à fuir (abîme), boomerang qui revient (désert), traînées de feu (cendres).'});
NEWS.push({v:'6.24',t:'Neuf attaques de plus (lot 3) : embusqués invisibles en forêt, sangsues qui s’accrochent et chapardeurs qui volent ton or (marais), flèches qui ricochent (ossuaire), pluie de roches et mur de feu (volcan), verglas où l’on glisse (givre), rayon tournant et gardiens miroirs qui renvoient tes sorts (forge céleste). Toutes les 32 attaques du catalogue sont maintenant en jeu.'});
NEWS.push({v:'6.25',t:'Le boss de l’acte I (Varsha et ses versions dans chaque monde) a deux formes. À zéro dans la première, il s’effondre puis se relève, plus grand et plus rapide : il bondit sur toi (une ombre au sol l’annonce) et le sol se met à brûler par endroits. Chaque forme a un peu plus de la moitié de la vie d’avant : le combat dure à peu près pareil.'});
NEWS.push({v:'6.26',t:'Équilibre : le guerrier et l’archer rattrapent le mage. Nouvelle statistique « dégâts des attaques », le pendant des « dégâts des sorts » pour les coups d’arme et les compétences qui ne sont pas des sorts. Maîtrise des armes, Fureur éternelle, Œil de faucon et Archer sans fin la donnent ; les épées, haches, masses, dagues et arcs en ont de base (tes vieilles armes aussi), et elle tombe sur les armes, gants, anneaux et amulettes. Flèche ardente plus forte et moins chère ; elle et la Pluie de flèches comptent maintenant comme des attaques.'});
NEWS.push({v:'6.27',t:'Chemins de traverse propres à chaque monde : chaque monde a ses huit traverses, avec leur nom, leur petite histoire, leur chef (braconniers en forêt, pillards au désert, prieur fou à l’ossuaire…) et leurs pierres à réveiller (cairns, obélisques, soupapes, prismes…). Les récompenses ne changent pas.'});
NEWS.push({v:'6.28',t:'Dehors, plus de murs : les zones de plaine sont bordées d’arbres en forêt, de dunes au désert, d’eau profonde au marais, de crevasses de glace au givre, de haies pâles au pré, de rochers ailleurs. Les cryptes, les antres et les mondes bâtis gardent leurs murs. Nouvelle forme de zone, la Grande étendue : une carte très ouverte, sans couloirs, avec quelques obstacles épars (pour les actes pas encore tirés).'});
NEWS.push({v:'6.29',t:'Histoire plus détaillée, pour ceux qui la veulent : le chef du camp raconte ce qui se passe dans son monde (« Parler de ce monde », un nouveau texte après chaque boss). Quatre lettres par monde à trouver sur les dépouilles et au bout des chemins de traverse. Le carnet dit enfin qui l’a écrit (Edern, un cartographe) ; complet, il donne un point de talent. Nouvel onglet Histoire qui range tout, monde par monde.'});
NEWS.push({v:'6.30',t:'Vraies classes : Guerrier (plus de vie et d’armure, moins de mana), Mage (plus de mana et de sorts, fragile), Archer (rapide et précis, un peu fragile). Les deux branches de ta classe coûtent 1 point par rang, les autres 2 ; une arme d’une autre classe frappe 30 % moins fort. Nouvelle partie : on choisit sa classe au départ. Partie en cours : ton héros reste libre comme avant ; choisis une classe quand tu veux (Talents), tes points te sont rendus.'});
NEWS.push({v:'6.31',t:'Artisanat simplifié : relancer un bonus, en ajouter un ou monter la rareté se fait maintenant seulement avec les orbes, chez la lapidaire (tes matériaux s’y échangent contre des orbes). Le Démolisseur casse tes objets en matériaux et garde la corruption.'});
NEWS.push({v:'6.32',t:'Graphismes : chaque classe a son allure. Le mage porte une robe longue et une capuche pointue, l’archer un carquois dans le dos et une capuche verte (les capuches se voient quand le casque est caché ou absent).'});
NEWS.push({v:'6.33',t:'Équilibre : la Flèche ardente explose plus large (1,75 case au lieu de 1,3) et fait 90 % de ses dégâts autour du point d’impact. L’archer rattrape le guerrier contre les groupes.'});
NEWS.push({v:'6.34',t:'Graphismes : les ennemis d’élite se lisent mieux. Anneau de couleur au sol qui pulse (doré pour les mini-boss, violet pour les gardiens, couleur de l’affixe pour les champions), barre de vie plus épaisse et un symbole par affixe au-dessus : » rapide, ! enragé, ♥ vampirique, ■ blindé, ◆ insaisissable, * glacial, ♛ chef de meute, ▲ incendiaire.'});
NEWS.push({v:'6.35',t:'Graphismes : les sorts éclairent le décor. Les explosions, les météores et les novas jettent un éclair de lumière colorée autour d’eux et laissent une brûlure au sol. La Flèche ardente ressemble enfin à une flèche, avec une pointe en feu, et la Boule de feu a un cœur blanc qui palpite.'});
NEWS.push({v:'6.36',t:'Corrections de l’audit. Les grandes cartes ouvertes s’affichent maintenant sur iPad et en mode paysage (le sol était trop grand pour Safari). Couloirs et descentes : un quart de meutes en moins, ils étaient trois fois plus durs que le reste. Mage : barrière de mana, 25 % des dégâts reçus sont payés en mana tant qu’il en reste.'});
NEWS.push({v:'6.37',t:'Mage, après les combats de boss des robots : vie −15 % au lieu de −25 %. Le bâton lance maintenant un trait de magie à 4,5 cases au lieu de frapper au corps à corps, pour continuer à attaquer à distance quand la mana est vide. Barrière du mage moins gourmande : un point de mana absorbe maintenant deux points de dégâts, le mage garde de quoi lancer ses sorts contre les boss. Lisibilité au téléphone : les plus petits textes (talents, inventaire, lapidaire) sont agrandis et les petits boutons et onglets font au moins 36 px de haut, plus faciles à toucher.'});
NEWS.push({v:'6.38',t:'Graphismes : les monstres tombés se dissolvent en cendres à la couleur de leur monde (fumée pâle pour les spectres). Carton d’entrée de boss : bandes noires et nom en grand. Les coups critiques éclatent en doré. Un champion, un mini-boss ou un boss qui tombe fige l’action une fraction de seconde.'});
NEWS.push({v:'6.39',t:'Zones purifiées : abats 80 % des monstres d’une zone d’acte pour la purifier (butin rare, deux orbes, or, un peu d’expérience). Toutes les zones d’un acte purifiées : un objet légendaire et trois orbes. Le pourcentage s’affiche sous le nom de la zone, et passé 60 % une flèche montre le monstre restant le plus proche. Foncer vers le boss reste possible : c’est toi qui choisis la durée de ton acte.'});
NEWS.push({v:'6.40',t:'Les Saisons arrivent. Première saison : la Marée de suie (jusqu’à fin janvier). Des hérauts de la Marée errent dans les zones d’acte : abats-les pour leurs perles de suie. Menu, Saison : un journal de 8 objectifs (fini, il t’offre la Cape de la Marée pour toujours) et un comptoir (orbes, objets rares et légendaires, la cape).'});
NEWS.push({v:'6.41',t:'Confort de jeu. Tu reprends ta partie dans la zone où tu étais, et ton portail reste ouvert même après avoir fermé le jeu. À ta mort : « Revenir par le portail ». Touche la minicarte pour une grande carte. Flèches vers la sortie (zone purifiée) et vers l’acolyte. Petit résumé en quittant une zone (temps, monstres, meilleur butin). Stats : « Ta partie » (temps de jeu, boss, zones purifiées…). Coffre : onglets renommables, et « Tout au coffre » remplit les autres onglets quand le premier est plein.'});
NEWS.push({v:'6.42',t:'Build et butin. Au camp, un mannequin d’entraînement : frappe-le pour voir tes dégâts par seconde. Talents : trois préréglages (enregistrés partout, chargés gratuitement au camp) et un aperçu de ce que donne un point de plus. Colporteur : rachat des 10 derniers objets vendus. Découvertes : journal de tes 20 derniers objets rares et mieux.'});
NEWS.push({v:'6.43',t:'Corrections trouvées par les robots cette nuit. La forge ne fait plus monter le prix de revente (forger puis vendre rapportait de l’or). Un préréglage de talents ne s’enregistre que si tous les points sont placés (un arbre vide servait de réinitialisation gratuite). Textes : hauts faits des mondes renommés (les mondes sont tirés au hasard), guide du camp à jour pour le Démolisseur.'});
NEWS.push({v:'6.44',t:'Lot de finition. Toucher un objet ou un talent ne fait plus sauter l’écran : la description reste collée en bas du panneau, et le double-toucher pour équiper marche sans interruption. Bogue corrigé : des talents de départ étaient actifs avant leur palier (Tourbillon, Flèche ardente) ; ils sont maintenant au premier palier, et si ta partie en avait un, tes talents te sont rendus gratuitement. La mini-carte ne montre plus que les ennemis que tu vois. Le soleil est dans le ciel, derrière le monde, et suit la carte ; pas de soleil ni d’oiseaux dans les cryptes et les antres, des chauves-souris à la place. Le mannequin d’entraînement est à part, en haut du camp, avec une mention.'});
NEWS.push({v:'6.45',t:'La puissance vient de l’équipement. Les compétences frappent un peu moins fort d’elles-mêmes (la Boule de feu coûte 5 mana au lieu de 6) ; les bonus de dégâts, de sorts et d’attaques des objets sont petits sur les objets de bas niveau et grandissent avec le niveau de l’objet (comme avant en fin de jeu). « + à toutes les compétences » seulement sur les objets de niveau 12 et plus. Guerrier : chaque coup d’arme touche aussi un deuxième monstre collé à lui. Tes talents te sont rendus gratuitement.'});
NEWS.push({v:'6.46',t:'Revenir ou refaire une zone. Une zone que tu quittes reste telle quelle 15 minutes (monstres tués, coffres ouverts, objets au sol), puis se remet à neuf toute seule. Pour la refaire tout de suite : « Neuve » au point de passage, ou « Remettre cette zone à neuf » sur la grande carte (touche la minicarte).'});
NEWS.push({v:'6.47',t:'Résistances aux éléments. Le feu, le froid, la foudre et le poison passent par l’armure, puis par ta résistance (75 % au plus). À partir du monde 2, chaque monde retire 8 % à toutes tes résistances (40 % au plus). Nouveaux bonus sur les objets (résistance au feu, au froid, à la foudre, au poison, et « toutes les résistances » sur les rares). Bram vend des anneaux de résistance. Feu : brûle encore 2 secondes. Froid : ralentit. Foudre : coups inégaux. Poison : arrive lentement. Nouveaux champions : Électrique et Venimeux. Tes résistances sont dans Menu, Stats.'});
NEWS.push({v:'6.48',t:'Ramasser au choix : les objets ne se ramassent plus en passant. Touche le nom d’un objet au sol, ou la fenêtre « Au sol » à gauche (elle montre les objets proches ; touche-en un pour aller le prendre). L’or, les fioles, les orbes et les pierres restent automatiques. Pour revenir à l’ancien ramassage : Menu, Réglages. Un ✕ ferme la fiche d’un talent ou d’un objet sans fermer le reste. Le bouton du sac ouvre toujours le sac.'});
NEWS.push({v:'6.49',t:'Un début moins facile contre les hordes. Les premières zones ont moins de monstres, en petits groupes de 2 ou 3 bien espacés ; la densité normale revient graduellement vers le niveau 8. Un monstre ordinaire que tu ne frappes pas lâche la poursuite s’il s’éloigne trop de chez lui, et y retourne : on ne traîne plus toute la carte derrière soi. Chaque monstre du début donne un peu plus d’expérience. Le Tourbillon du guerrier se gagne au niveau 3 (avant, on frappe à l’arme).'});
NEWS.push({v:'6.50',t:'Le Tourbillon du guerrier a sa propre allure : deux lames d’acier qui tournent, des étincelles et de la poussière, et une hache 🪓 comme symbole. Le portail garde son tourbillon bleu 🌀 : on ne les confond plus.'});
NEWS.push({v:'6.51',t:'La table de jeu, au camp (à gauche, près du mur). Quatre joueurs changent le ton du texte des ennemis : Brasquin le démon (noms sanglants, menaces), Aubelle l’ange (noms doux, mots gentils), Pirouette le clown (noms drôles, blagues) et Maître Fendric (comme avant). Les noms, la barre de cible, le bestiaire et ce que crient les ennemis changent ; jamais les noms des boss.'});
NEWS.push({v:'6.52',t:'Placer un sort dans la barre redevient facile : la rangée « Barre : 1 2 3 4 » est maintenant tout en haut de la fiche du talent, juste sous son nom, et aussi dans la fiche complète. Touche un numéro : le sort y va. La fenêtre « Au sol » est maintenant juste au-dessus de la bulle de mana.'});
NEWS.push({v:'6.53',t:'La table de jeu monte le ton. Brasquin le démon : noms et menaces d’une violence démoniaque. Aubelle l’ange : dévot exalté, des paroles sacrées qui ne disent rien et tout à la fois. Pirouette le clown : blagues bêtes et un peu vulgaires. Maître Fendric ne change pas. Deux fois plus de noms et trois à quatre fois plus de répliques pour chacun.'});
NEWS.push({v:'6.54',t:'Seuls les ennemis de forme humaine parlent : les bêtes, araignées, scorpions et dragonnets se taisent. Les paroles restent 5 secondes, au-dessus de la tête de celui qui parle, et ne se perdent plus parmi les chiffres de dégâts. Les animaux s’annoncent : avant de mordre, une bête se ramasse 1 seconde et un cercle rouge marque où elle va frapper ; avant de foncer, un cerf, un sanglier ou un loup vise 1 seconde et une ligne rouge montre sa course. Écarte-toi et le coup rate. La morsure fait un peu plus mal pour compenser. Les boss ne changent pas.'});
NEWS.push({v:'6.55',t:'Chaque classe n’a plus accès qu’à ses deux branches : Guerre et Rempart pour le guerrier, Pyromancie et Ombre pour le mage, Archerie et Ombre pour l’archer. Les points placés ailleurs sont remboursés. Dix nouveaux talents par classe, six actifs et quatre passifs : Ruée, Fendoir, Séisme, Coup de bouclier, Provocation, Marteau du juge, Mur de flammes, Éruption, Couronne de feu, Trait d’ombre, Nuage toxique, Danse des lames, Flèche de givre, Saut en arrière, Flèche à fragments, et dix passifs. Les ennemis parlent moins souvent : 30 secondes au moins entre deux paroles.'});
NEWS.push({v:'6.56',t:'La campagne résiste. Les acolytes et les lieutenants ont 60 % de vie de plus et frappent 25 % plus fort ; Varsha et Valgris ont 50 % de vie de plus et frappent 30 % plus fort ; les champions sont un peu plus coriaces. Un héros en retard sur ses ennemis le sent : par niveau de retard (5 au plus), il reçoit 5 % de dégâts de plus et en inflige 4 % de moins. Les monstres ordinaires ne changent pas, les failles et les épreuves non plus. Les chemins de traverse aident à rattraper son retard. L’armure du Forgeron sans visage garde sa taille d’avant.'});
NEWS.push({v:'6.57',t:'Craft de précision. Chez le Démolisseur, onglet Extraire : choisis une propriété d’un objet, il le casse et t’en garde l’essence (magique 70 %, rare 85 %, légendaire 100 % de sa valeur). Chez la forgeronne, onglet Essences : pose l’essence sur un objet qui a une place libre, ou choisis la propriété à remplacer (or et matériaux). Chaque objet a 3 points de forge : une essence posée en coûte un, et un orbe qui change les propriétés aussi (l’élévation, le serment et l’oubli restent gratuits). À zéro, l’objet est fini. Tes objets d’avant reçoivent leurs 3 points. Nouveau : une case de relique par objet. Douze reliques, quatre par classe, changent un sort au lieu d’ajouter des chiffres (Tourbillon qui attire, Boule de feu qui se divise, Volée qui rebondit…). Elles tombent sur les acolytes, les lieutenants et les boss, et la forgeronne les pose (onglet Reliques).'});
NEWS.push({v:'6.58',t:'Les Brasiers, des paliers de difficulté sans fin. Faire plier Valgris ouvre le Brasier suivant ; tu le choisis au camp, chez Corvel, et tu peux redescendre quand tu veux. À chaque Brasier, les monstres ont 25 % de vie et 15 % de dégâts de plus (ça s’additionne vite), tes résistances baissent de 5 % (30 au plus), et tu gagnes 20 % d’expérience de plus, plus d’objets rares et plus de reliques. Les failles et les épreuves ne changent pas. Ton plus haut Brasier battu est dans tes statistiques et dans trois nouveaux hauts faits. Une partie où Valgris a déjà plié a le Brasier 1 ouvert.'});
function verNum(v){const m=/^(\d+)\.(\d+)/.exec(v||'');return m?+m[1]*1000+ +m[2]:0;}
/* v5.83 : guide en jeu */
const GUIDE=[{"t": "Le camp", "x": "Chaque monde a son camp. Le colporteur vend fioles et parchemins, la forgeronne remet tes objets à ton niveau, le démolisseur casse et corrompt, la lapidaire travaille tes objets avec les orbes, la joueuse vend à l’aveugle, le recruteur loue et fait évoluer les compagnons. Le tableau montre la mutation de la semaine et les contrats du jour."}, {"t": "Failles", "x": "La pierre de faille ouvre des failles de plus en plus dures. Abats assez de créatures, puis le gardien. Chaque nouvelle faille vaincue donne un point de talent. Dès la faille 5, des affixes s’ajoutent, avec plus de butin."}, {"t": "Cartes d’épreuve", "x": "Elles tombent en butin et s’ouvrent à la pierre de faille : Assaut, Duel, Braseros, Défense, Traque, Convoi, Proie. Leurs modificateurs rendent l’épreuve plus dure et plus payante. « Voile déchiré » fait venir les Arpenteurs, seuls porteurs du Pas du Voile."}, {"t": "Objets", "x": "Normal, magique, rare, légendaire, et les pièces d’ensemble en vert. Le démolisseur relance un bonus, en ajoute un, monte la rareté, ou corrompt : un seul essai, gros gain possible, une chance sur dix de tout perdre. Verrouille ce que tu veux garder."}, {"t": "Orbes de forge", "x": "Elles tombent des monstres (surtout champions et boss), des coffres et des dépouilles. La lapidaire, au camp, les pose sur tes objets et en échange contre des matériaux. Choisis l’objet, puis l’orbe : braise (normal vers magique), écume (relance un magique), cendre (magique vers rare), tumulte (relance un rare), aube (un bonus de plus), juste poids (relance les valeurs), vide (retire un bonus), oubli (retour à normal), élévation (au niveau du héros), serment (scelle un bonus contre les relances). Ni les objets verrouillés, ni les corrompus."}, {"t": "Talents et pierres", "x": "Cinq branches. Les pierres de compétence tombent en butin et montent d’un rang en double. Les pierres de soutien se sertissent dans une compétence depuis sa fiche. La barre passe à 5 places au niveau 15 et 6 au niveau 30."}, {"t": "Compagnons", "x": "Un à la fois. L’expérience le mène jusqu’à Vétéran ; Élite et Légendaire s’achètent avec des matériaux. Chaque rang ajoute un talent. Il ne dépasse jamais 30 % de tes dégâts."}, {"t": "Chemins de traverse", "x": "Chaque acte a 8 zones avant l’antre, et 4 chemins de traverse qui partent du chemin principal (entrées en bleu sur la mini-carte). Facultatifs, mais payants : une archère qui te suit, un point de talent pour toujours, un sac plus grand, des orbes, une pièce d’ensemble, un légendaire. Leur suivi est dans l’onglet Quêtes."}, {"t": "Zones et événements", "x": "Les zones se tirent une fois par partie : formes, modificateurs, événements (embuscade, reliquaire, puits, gibet…), parfois d’élites ou de nuit. La Cendre qui avance pousse vers la sortie : ne traîne pas."}, {"t": "Mondes", "x": "Après Valgris, accepte son défi pour passer au monde suivant. Tout te suit. Les boss changent un peu d’un monde à l’autre : regarde le sol, les cercles annoncent les coups."}, {"t": "Réglages", "x": "Dans les Stats : sons, ambiance, graphismes (hauts, normaux, économie), nouveautés. Le filtre de butin est dans l’inventaire."}];
function lookPanel(){const L=p.look||{},c=document.createElement('canvas');c.width=120;c.height=150;const g=c.getContext('2d');g.fillStyle='#1e1a16';g.fillRect(0,0,120,150);drawHero(g,60,135,2.2,{cls:p.cls,look:L,eq:p.eq,face:.4,moving:false,t:S.t,swing:0,spin:0,buff:0});
  openPanel(`<h2>Apparence</h2><div style="text-align:center"><img src="${c.toDataURL()}" width="120" height="150" style="image-rendering:pixelated;border:1px solid #3a2e20"></div>

  invasion(z,ev,dt){if(ev.state==='idle'){if(Math.hypot(p.x-ev.x,p.y-ev.y)<7){ev.state='on';ev.t=0;ev.sp=1;evSeen('invasion');const ws=Object.keys(THEMES).filter(k=>k!==curWorld().theme);ev.th=pick(ws);

  '« Ma lanterne s’éteint quand ils approchent. Elle s’est éteinte il y a une heure. »',
  '« Liste : corde, sel, pain, deux flèches. Il me reste le sel. »',
  '« Les barils rouges sautent. Les monstres sont bêtes : ils se mettent juste à côté. »',
  '« Note pour moi-même : ne plus jamais caresser un ver géant, même s’il a l’air gentil. »',

function searchCorpse(o){if(o.done)return;o.done=true;const z=S.cur,L=Math.max(1,z.def.lvl||1);burst(o.x,o.y,'#8a7a60',12);sfx('gold');
